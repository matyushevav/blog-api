services:
  db:
    image: postgres:15-alpine
    container_name: blog_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog_db
    ports:
      - "7432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: blog_api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: blog_db
      DB_SSLMODE: disable
      # Секрет берется из .env рядом с docker-compose.yml, если он там задан
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRY_HOURS: 24
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      LOGS_FILE: ./log.txt
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 35s

volumes:
  postgres_data:
